<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>操作ガイド</title>
    <script>try { var t = localStorage.getItem('webaudiomix_theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <p class="eyebrow">Step 0</p>
            <h2>操作ガイド</h2>
            <p class="lead">実験の流れと回答方法を順に説明します。矢印キー（← →）でも操作できます。</p>
        </header>

        <div id="stepper" class="stepper" data-current="howto"></div>

        <div class="movie">
            <div id="movieBar" class="movie-bar"></div>
            <div class="movie-body"><div id="scenes"></div></div>
            <div class="movie-foot">
                <div id="dots" class="dots"></div>
                <div class="movie-controls">
                    <span id="chapter" class="movie-count"></span>
                    <button id="btnPrev" class="btn-secondary">戻る</button>
                    <button id="btnPlay" class="btn-secondary">一時停止</button>
                    <button id="btnNext" class="btn-secondary">次へ</button>
                </div>
            </div>
        </div>

        <div class="btn-row end" style="margin-top:18px;">
            <button onclick="location.href='index.html'" class="btn-secondary">ホームに戻る</button>
            <button id="btnGoCalibrate" class="btn-primary">STEP 1 音量校正へ</button>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/howto.js"></script>
</body>
</html>
