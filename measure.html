<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>聴力測定 (Calibration)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>Step 1: 基準聴力の測定</h2>
        </header>

        <div id="loadingPanel" class="panel">
            <h3>準備中...</h3>
            <p>音声ファイルを読み込んでいます。</p>
        </div>

        <div id="measurePanel" class="panel hidden">
            <h3>静寂時閾値の測定</h3>
            <p>
                開始すると、一定の間隔で「ピー」という音が大きくなります。<br>
                聞こえ始めたら、すぐに<strong>スペースキー</strong>を押してください。<br>
                その後に3段階音が小さくなり、再度測定が行われますが同様に聞こえたらスペースキーを押してください。<br>
            </p>

            <div class="status-box" id="statusBox">待機中</div>
            <div id="stepCounter" style="font-size: 6em; font-weight: bold; display: none; text-align: center; margin: 20px 0; color: #f1c40f;">1</div>

            <button id="btnStartMeasure" class="btn-primary">測定開始</button>
        </div>

        <div id="resultPanel" class="panel hidden">
            <h3>測定完了</h3>
            <p>あなたの閾値: <strong id="resultValue" style="font-size:1.5em; color:#f1c40f;">---</strong></p>
            <p>データを保存しました。次に進んでください。</p>
            <button onclick="location.href='game.html'" class="btn-primary">Step 2: トレーニングへ進む</button>
        </div>
    </div>
    <script src="js/measure.js"></script>
</body>
</html>
