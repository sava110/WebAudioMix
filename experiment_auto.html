<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>聴覚実験：自動化バージョン</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; text-align: center;}
        .display-area {
            border: 2px solid #333; height: 150px;
            display: flex; align-items: center; justify-content: center;
            margin: 20px 0; background: #f9f9f9; font-size: 24px; font-weight: bold;
        }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; margin: 5px; }
        .btn-reaction { background-color: #ff4444; color: white; border: none; display: none; width: 100%; }
        .log-area { text-align: left; background: #eee; padding: 10px; height: 100px; overflow-y: scroll; }
    </style>
</head>
<body>

    <h2>聴覚実験（上昇法）</h2>

    <div style="text-align: left; margin-bottom: 20px;">
        <label>ノイズ音源: <input type="file" id="noiseInput" accept="audio/*"></label><br>
        <label>シグナル周波数: <input type="number" id="freqInput" value="4000" step="100"> Hz</label>
    </div>

    <div class="display-area" id="statusDisplay">
        準備ができたら<br>「実験開始」を押してください
    </div>

    <button id="startBtn" disabled>実験開始 (Start)</button>

    <button id="reactionBtn" class="btn-reaction">聞こえた！ (SPACEキー)</button>

    <h3>記録データ (Gain値)</h3>
    <div class="log-area" id="resultLog"></div>
    <button onclick="downloadCSV()">CSV保存</button>

    <script>
        // --- 変数定義 ---
        let audioCtx;
        let noiseBuffer = null;
        let signalOscillator = null;
        let signalGain = null;
        let noiseSource = null;
        let noiseGain = null;

        // 実験制御用のタイマーID
        let waitTimer = null;   // 3秒待つ用
        let rampTimer = null;   // 音量を上げる用

        let currentSignalVol = 0; // 現在のシグナル音量
        let results = [];         // 結果保存用配列

        // DOM要素
        const startBtn = document.getElementById('startBtn');
        const reactionBtn = document.getElementById('reactionBtn');
        const statusDisplay = document.getElementById('statusDisplay');
        const logArea = document.getElementById('resultLog');

        // 1. ファイル読み込み (前回と同じ)
        document.getElementById('noiseInput').addEventListener('change', async (e) => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const file = e.target.files[0];
            if (!file) return;
            const arrayBuffer = await file.arrayBuffer();
            noiseBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            startBtn.disabled = false;
            statusDisplay.textContent = "準備完了";
        });

        // 2. 実験開始フロー
        startBtn.addEventListener('click', startTrial);

        function startTrial() {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // UIの切り替え
            startBtn.style.display = 'none';
            reactionBtn.style.display = 'block';
            statusDisplay.textContent = "ノイズ再生中... (待機)";

            // ノイズ再生開始
            playNoise();

            // 3秒後にシグナル開始のタイマーセット
            waitTimer = setTimeout(() => {
                startSignalRamp();
            }, 3000); // 3000ms = 3秒待機
        }

        // ノイズだけ鳴らす
        function playNoise() {
            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;
            noiseSource.loop = true;
            noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0.5; // ノイズ音量は固定
            noiseSource.connect(noiseGain).connect(audioCtx.destination);
            noiseSource.start();
        }

        // シグナル音を徐々に大きくする処理
        function startSignalRamp() {
            statusDisplay.textContent = "計測中... 音に集中してください";
            statusDisplay.style.backgroundColor = "#ffe";

            // シグナル音源の作成
            signalOscillator = audioCtx.createOscillator();
            signalOscillator.type = 'sine';
            signalOscillator.frequency.value = document.getElementById('freqInput').value;

            signalGain = audioCtx.createGain();
            signalGain.gain.value = 0; // 最初は無音 (0)
            currentSignalVol = 0;

            signalOscillator.connect(signalGain).connect(audioCtx.destination);
            signalOscillator.start();

            // --- 自動化の核心部分 ---
            // 50ミリ秒ごとに音量を 0.001 ずつ上げる
            rampTimer = setInterval(() => {
                currentSignalVol += 0.001;

                // 上限ガード (音が大きくなりすぎないように)
                if(currentSignalVol > 1.0) currentSignalVol = 1.0;

                // 音量を適用
                // 線形(Linear)に変化させていますが、厳密な実験ではデシベル計算が必要です
                signalGain.gain.value = currentSignalVol;

            }, 50); // 更新間隔 (ms)
        }

        // 3. 反応（聞こえた！）処理
        reactionBtn.addEventListener('click', recordReaction);
        // スペースキーでも反応できるようにする
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && reactionBtn.style.display === 'block') {
                recordReaction();
            }
        });

        function recordReaction() {
            // タイマーをすべて止める
            clearTimeout(waitTimer);
            clearInterval(rampTimer);

            // 音を止める
            if (signalOscillator) signalOscillator.stop();
            if (noiseSource) noiseSource.stop();

            // データを記録
            const record = {
                freq: document.getElementById('freqInput').value,
                threshold: currentSignalVol.toFixed(4) // 小数点4桁まで
            };
            results.push(record);

            // ログ表示
            const p = document.createElement('p');
            p.textContent = `${results.length}回目: ${record.freq}Hz -> Gain: ${record.threshold}`;
            logArea.prepend(p);

            // UIを戻す
            startBtn.style.display = 'inline-block';
            reactionBtn.style.display = 'none';
            statusDisplay.textContent = "計測終了。次のトライアルへ";
            statusDisplay.style.backgroundColor = "#f9f9f9";
        }

        // CSVダウンロード機能
        function downloadCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Frequency(Hz),Threshold(Gain)\n";
            results.forEach(r => {
                csvContent += `${r.freq},${r.threshold}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "experiment_data.csv");
            document.body.appendChild(link);
            link.click();
        }
    </script>
</body>
</html>
