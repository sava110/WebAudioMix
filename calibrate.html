<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Step 0: Calibration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>Step 0: 音量キャリブレーション</h2>
        </header>

        <div class="panel">
            <h3>リニアリティ・チェックモード</h3>
            <p>
                スマートフォンの騒音計アプリなどで確認してください。<br>
                <strong>① 60dBボタン</strong>を押し、PC音量を調整して<strong>60dB</strong>に合わせます。<br>
                <strong>② 50dBボタン</strong>を押し、アプリの数値が<strong>50dB</strong>（±1dB以内）になるか確認してください。
            </p>
            
            <div id="statusBox" class="status-box">待機中</div>

            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
                <button id="btn60dB" class="btn-primary">60dB 再生</button>
                <button id="btn50dB" class="btn-secondary">50dB 再生</button>
            </div>
            
            <button id="btnStop" class="btn-danger" style="width: 100%; margin-bottom: 20px;">音を止める</button>

            <p class="instruction">50dBが正しく計測できれば、システムの線形性は正常です。</p>
            <button onclick="location.href='measure.html'" class="btn-primary">Step 1: 測定へ進む</button>
        </div>
    </div>
    <script src="js/calibrate.js"></script>
</body>
</html>
